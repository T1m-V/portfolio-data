name: Price Robot

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout data
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch prices
        run: uv run portfolio-market --data-dir "$GITHUB_WORKSPACE" prices update

      - name: Commit changed prices
        run: |
          git config user.name "Price Robot"
          git config user.email "price-robot@users.noreply.github.com"
          git add prices latest_prices.csv

          if ! git diff --cached --quiet; then
            git commit -m "Price Robot: $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No price changes detected."
          fi
